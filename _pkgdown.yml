reference:
- title: Prepare data for deepSTRAPP
  desc: |
    All-in-one functions to prepare trait and diversification data to use as inputs for a deepSTRAPP run.
  contents:
  - prepare_trait_data
  - prepare_diversification_data
- title: Import results from external analyses
  desc: |
    Functions to format results from external analyses as inputs for a deepSTRAPP run.
  contents:
  - convert_contsimmap_to_contMaps_list
  - aggregate_contMaps
  - convert_BSM_to_simmap
  - convert_simmaps_to_densityMaps
  - build_BAMM_object
  - subset_BAMM_object
- title: Run deepSTRAPP worflow
  contents:
  - run_deepSTRAPP_for_focal_time
  - run_deepSTRAPP_over_time
  - compute_STRAPP_test_for_focal_time
- title: Extract data from mapped phylogenies
  contents:
  - extract_most_likely_trait_values_for_focal_time
  - extract_all_trait_values_for_focal_time
  - extract_trait_data_melted_df_for_focal_time
- title: Extract data from BAMM objects
  contents:
  - extract_diversification_data_melted_df_for_focal_time
  - update_rates_and_regimes_for_focal_time
- title: Cut phylogenies
  desc: |
    Cut different types of mapped phylogenies to a given focal-time.
  contents:
  - cut_phylo_for_focal_time
  - cut_contMap_for_focal_time
  - cut_contMaps_for_focal_time
  - cut_densityMap_for_focal_time
